<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Has Moved | Rajarshi Das</title>
    <!-- Google Fonts: Outfit & Fira Code -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #080b11;
            --card-bg: rgba(17, 24, 39, 0.45);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-cyan: #38bdf8;
            --accent-purple: #a855f7;
            --transition-speed: 0.3s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.08) 0%, transparent 40%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Abstract glowing particles in background */
        .glow-sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
        }

        .glow-1 {
            width: 300px;
            height: 300px;
            background: var(--accent-cyan);
            top: 20%;
            left: 15%;
            opacity: 0.05;
            animation: float-slow 15s infinite alternate;
        }

        .glow-2 {
            width: 400px;
            height: 400px;
            background: var(--accent-purple);
            bottom: 10%;
            right: 15%;
            opacity: 0.05;
            animation: float-slow 20s infinite alternate-reverse;
        }

        @keyframes float-slow {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-30px) scale(1.1); }
        }

        /* Glassmorphism Card Container */
        .redirect-container {
            width: 90%;
            max-width: 550px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 1;
            transform: translateY(20px);
            opacity: 0;
            animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fade-in-up {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .icon-wrapper {
            width: 70px;
            height: 70px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 1.8rem;
            color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.1);
            animation: pulse-glow 3s infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(56, 189, 248, 0.1); }
            50% { box-shadow: 0 0 35px rgba(56, 189, 248, 0.25); }
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 30%, #a8a29e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .new-url {
            font-family: 'Fira Code', monospace;
            color: var(--accent-cyan);
            background: rgba(56, 189, 248, 0.05);
            border: 1px dashed rgba(56, 189, 248, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            display: inline-block;
            margin-top: 0.5rem;
        }

        /* Countdown Progress Bar */
        .progress-container {
            margin: 2rem 0;
            text-align: left;
        }

        .progress-label {
            font-size: 0.88rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .progress-label span#seconds {
            font-weight: 600;
            color: var(--accent-purple);
        }

        .progress-bar {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            transform-origin: left;
            animation: shrink-bar 5s linear forwards;
        }

        @keyframes shrink-bar {
            from { transform: scaleX(1); }
            to { transform: scaleX(0); }
        }

        /* Button Action styling */
        .btn-redirect {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-purple) 100%);
            color: #080b11;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 1rem 2rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all var(--transition-speed);
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.15);
        }

        .btn-redirect:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(56, 189, 248, 0.35);
            color: #ffffff;
        }

        .btn-redirect:active {
            transform: translateY(0);
        }

        .btn-redirect i {
            transition: transform var(--transition-speed);
        }

        .btn-redirect:hover i {
            transform: translateX(4px);
        }

        .fallback-link {
            display: block;
            margin-top: 1.5rem;
            font-size: 0.88rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color var(--transition-speed);
        }

        .fallback-link:hover {
            color: var(--accent-cyan);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Ambient background glows -->
    <div class="glow-sphere glow-1"></div>
    <div class="glow-sphere glow-2"></div>

    <!-- Redirection Card -->
    <div class="redirect-container">
        <div class="icon-wrapper">
            <i class="fas fa-route"></i>
        </div>
        <h1>Portfolio Moved</h1>
        <p>
            My portfolio website has moved to a new and faster custom domain:
            <br>
            <span class="new-url">rajarshi.dev</span>
        </p>

        <!-- Redirect countdown -->
        <div class="progress-container">
            <div class="progress-label">
                <span>Redirecting automatically...</span>
                <span>in <span id="seconds">5</span>s</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>

        <!-- Button to go immediately -->
        <a href="https://rajarshi.dev" class="btn-redirect" id="redirect-btn">
            Go to rajarshi.dev <i class="fas fa-arrow-right"></i>
        </a>

        <a href="https://rajarshi.dev" class="fallback-link">
            Click here if you are not redirected
        </a>
    </div>

    <script>
        const targetUrl = "https://rajarshi.dev";
        let countdown = 5;
        const countdownEl = document.getElementById("seconds");

        // Decrement the countdown clock every second
        const timer = setInterval(() => {
            countdown--;
            countdownEl.textContent = countdown;
            if (countdown <= 0) {
                clearInterval(timer);
                window.location.href = targetUrl;
            }
        }, 1000);

        // Immediate redirection on button click
        document.getElementById("redirect-btn").addEventListener("click", (e) => {
            clearInterval(timer);
        });
    </script>
</body>
</html>
